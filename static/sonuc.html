<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sonuç — Veritabanı Asistanı</title>
<style>
  :root {
    --zemin: #eef1f6;
    --panel: #fff;
    --kenar: #e5e9f0;
    --soluk: #6b7686;
    --silik: #98a2b3;
    --renk: #3452d8;
    --metin: #131824;
    --golge: 0 1px 2px rgba(16,24,40,.04), 0 10px 30px -14px rgba(16,24,40,.20);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--zemin); color: var(--metin);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sarici { max-width: 1080px; margin: 0 auto; padding: 0 20px 72px; }

  /* ---------- ust bant ---------- */
  .bant { background: var(--renk); color: #fff; padding: 26px 0 0; margin-bottom: 22px; }
  .bant-ic { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .bant .soru { font-size: 12.5px; opacity: .72; margin: 0 0 6px; letter-spacing: .01em; }
  .bant h1 { font-size: 26px; margin: 0 0 6px; font-weight: 660; letter-spacing: -.02em; }
  .bant .gorev { font-size: 13.5px; opacity: .82; margin: 0 0 20px; max-width: 70ch; }

  /* sekmeler: alt cizgili gercek sekme gorunumu */
  .sekmeler { display: flex; gap: 4px; overflow-x: auto; }
  .sekme {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 11px 16px; border-radius: 10px 10px 0 0; text-decoration: none;
    color: rgba(255,255,255,.72); font-size: 13.5px; font-weight: 550;
    border-bottom: 3px solid transparent; transition: all .15s;
  }
  .sekme:hover { color: #fff; background: rgba(255,255,255,.08); }
  .sekme .nokta { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; opacity: .7; }
  .sekme.aktif {
    color: var(--metin); background: var(--zemin);
    border-bottom-color: var(--zemin); font-weight: 640;
  }
  .sekme.aktif .nokta { opacity: 1; }

  /* ---------- olcu kutulari ---------- */
  .olculer {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .olcu {
    background: var(--panel); border: 1px solid var(--kenar);
    border-radius: 12px; padding: 13px 16px;
  }
  .olcu .ad {
    font-size: 11px; color: var(--silik); text-transform: uppercase;
    letter-spacing: .07em; font-weight: 620;
  }
  .olcu .deger {
    font-size: 21px; font-weight: 680; margin-top: 3px;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .olcu .alt { font-size: 12px; color: var(--soluk); margin-top: 1px; }

  /* ---------- kartlar ---------- */
  .kart {
    background: var(--panel); border: 1px solid var(--kenar);
    border-radius: 14px; margin-bottom: 18px; box-shadow: var(--golge);
    overflow: hidden;
  }
  .kart > h2 {
    font-size: 11.5px; margin: 0; padding: 15px 20px 0; font-weight: 660;
    color: var(--silik); text-transform: uppercase; letter-spacing: .07em;
  }
  .kart-ic { padding: 16px 20px 20px; }

  .ozet p { margin: 0; font-size: 15.5px; line-height: 1.72; }
  .ozet { border-left: 3px solid var(--renk); }

  /* ---------- grafik ---------- */
  .grafik { display: grid; gap: 2px; }
  .cizgi {
    display: grid; grid-template-columns: minmax(0, 34%) 1fr minmax(84px, auto);
    align-items: center; gap: 16px; padding: 7px 10px; border-radius: 9px;
  }
  .cizgi:hover { background: var(--zemin); }
  .cizgi .ad {
    font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .yol { background: #eef1f6; border-radius: 6px; height: 26px; overflow: hidden; }
  .cubuk {
    height: 100%; border-radius: 6px; background: var(--renk);
    transition: width .5s cubic-bezier(.22,.61,.36,1);
  }
  .cizgi .sayi {
    font-size: 14px; font-weight: 680; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .not { font-size: 12.5px; color: var(--soluk); margin-top: 14px; }

  /* ---------- tablo ---------- */
  .tablo-sarici { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  thead th {
    position: sticky; top: 0; background: var(--panel); z-index: 1;
    text-align: left; font-weight: 640; color: var(--silik); font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em;
    padding: 12px 20px; border-bottom: 1.5px solid var(--kenar); white-space: nowrap;
  }
  thead th.sayi { text-align: right; }
  td { padding: 11px 20px; border-bottom: 1px solid #f3f5f9; }
  td.sayi { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(even) { background: #fafbfd; }
  tbody tr:hover { background: #f4f7fc; }
  tbody tr:last-child td { border-bottom: none; }
  td.bos { color: var(--silik); }

  .bos-kart { padding: 40px 20px; text-align: center; color: var(--soluk); }

  @media (max-width: 640px) {
    .bant h1 { font-size: 21px; }
    .cizgi { grid-template-columns: minmax(0, 42%) 1fr auto; gap: 10px; }
    thead th, td { padding-left: 14px; padding-right: 14px; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --zemin: #10131a; --panel: #191d27; --kenar: #272d3a;
      --soluk: #98a2b3; --silik: #6b7686; --metin: #e8ebf1;
    }
    .yol { background: #232937; }
    td { border-bottom-color: #212734; }
    tbody tr:nth-child(even) { background: #1c212c; }
    tbody tr:hover { background: #212837; }
    thead th { background: var(--panel); }
  }
</style>
</head>
<body>

<div class="bant" id="bant">
  <div class="bant-ic">
    <p class="soru" id="soru"></p>
    <h1 id="baslik">Sonuç</h1>
    <p class="gorev" id="gorev"></p>
    <div class="sekmeler" id="sekmeler"></div>
  </div>
</div>

<div class="sarici">
  <div class="olculer" id="olculer"></div>

  <div class="kart ozet" id="ozetKarti" hidden>
    <h2>Özet</h2>
    <div class="kart-ic"><p id="ozet"></p></div>
  </div>

  <div class="kart" id="grafikKarti" hidden>
    <h2>Dağılım</h2>
    <div class="kart-ic">
      <div class="grafik" id="grafik"></div>
      <div class="not" id="not"></div>
    </div>
  </div>

  <div class="kart" id="tabloKarti" hidden>
    <h2>Veri</h2>
    <div class="tablo-sarici">
      <table><thead><tr id="tbaslik"></tr></thead><tbody id="tgovde"></tbody></table>
    </div>
  </div>

  <div class="kart" id="bosKart" hidden>
    <div class="bos-kart" id="bosMetin"></div>
  </div>
</div>

<script>
/* Tum adimlar TEK yukte tasinir; her sekme bir adimi gosterir ve ustteki
   sekmelerle diger ajanlara gecilir. Veri URL fragmentindedir: sunucuya
   gitmez ve widget baska bir alan adinda gomulu olsa bile calisir. */
function parcala() {
  const p = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  try {
    return {
      veri: JSON.parse(decodeURIComponent(p.get("veri") || "")),
      i: parseInt(p.get("i") || "0", 10),
    };
  } catch (e) {
    return { veri: null, i: 0 };
  }
}

function el(etiket, sinif, metin) {
  const d = document.createElement(etiket);
  if (sinif) d.className = sinif;
  if (metin !== undefined) d.textContent = metin;
  return d;
}

function sayi(n) {
  return n.toLocaleString("tr-TR", { maximumFractionDigits: 2 });
}

function adres(veri, i) {
  return "#veri=" + encodeURIComponent(JSON.stringify(veri)) + "&i=" + i;
}

function olcuEkle(kap, ad, deger, alt) {
  const k = el("div", "olcu");
  k.appendChild(el("div", "ad", ad));
  k.appendChild(el("div", "deger", deger));
  if (alt) k.appendChild(el("div", "alt", alt));
  kap.appendChild(k);
}

const durum = parcala();
const veri = durum.veri;
const i = durum.i;
const adim = veri && veri.adimlar && veri.adimlar[i];

if (!adim) {
  document.getElementById("bant").hidden = true;
  document.getElementById("bosKart").hidden = false;
  document.getElementById("bosMetin").textContent =
    "Sonuç verisi bulunamadı. Bu sayfa asistandaki bir cevaptan açılır.";
} else {
  document.title = adim.ajan + " — Veritabanı Asistanı";
  const renk = adim.renk || "#3452d8";
  document.documentElement.style.setProperty("--renk", renk);
  document.getElementById("bant").style.background = renk;

  if (veri.soru) document.getElementById("soru").textContent = "SORU · " + veri.soru;
  document.getElementById("baslik").textContent = adim.ajan;
  document.getElementById("gorev").textContent = adim.gorev || "";

  // Sekmeler: birden fazla ajan varsa gecis yapilabilir
  const sekmeler = document.getElementById("sekmeler");
  if (veri.adimlar.length > 1) {
    veri.adimlar.forEach(function (a, n) {
      const s = el("a", "sekme" + (n === i ? " aktif" : ""), a.ajan);
      s.href = adres(veri, n);
      const nokta = el("span", "nokta");
      if (n === i) nokta.style.background = a.renk;
      s.prepend(nokta);
      // Yalnizca fragment degistigi icin tarayici sayfayi yeniden cizmez.
      s.addEventListener("click", function () {
        setTimeout(function () { location.reload(); }, 0);
      });
      sekmeler.appendChild(s);
    });
  } else {
    sekmeler.style.height = "14px";
  }

  // Olcu kutulari: satir/kolon ve varsa en yuksek deger + toplam
  const olculer = document.getElementById("olculer");
  const satirlar = adim.rows || [];
  const kolonlar = adim.columns || [];
  olcuEkle(olculer, "Satır", sayi(satirlar.length));
  olcuEkle(olculer, "Kolon", sayi(kolonlar.length));

  if (adim.veri && adim.veri.length) {
    const degerler = adim.veri.map(function (d) { return d.deger; });
    const enBuyukD = Math.max.apply(null, degerler);
    const enUst = adim.veri.find(function (d) { return d.deger === enBuyukD; });
    olcuEkle(olculer, "En yüksek", sayi(enBuyukD), enUst ? enUst.etiket : "");

    // Toplam YALNIZCA tek birim varken gosterilir. Sonucta birden fazla para
    // birimi/birim varsa hepsini toplamak yanlis rakam uretir (TRY + USD gibi).
    const birimDeseni = /(para ?birim|birim|currency|kur)/i;
    const karisikBirim = kolonlar.some(function (ad, n) {
      if (!birimDeseni.test(String(ad))) return false;
      const farkli = new Set(satirlar.map(function (s) { return s[n]; }));
      return farkli.size > 1;
    });

    if (!karisikBirim) {
      olcuEkle(olculer, "Toplam", sayi(degerler.reduce(function (a, b) { return a + b; }, 0)),
               "gösterilen satırlar");
    } else {
      olcuEkle(olculer, "Toplam", "—", "birden fazla para birimi");
    }
  }
  if (veri.adimlar.length > 1) {
    olcuEkle(olculer, "Ajan", (i + 1) + " / " + veri.adimlar.length, "zincirde");
  }

  if (adim.cevap) {
    document.getElementById("ozet").textContent = adim.cevap;
    document.getElementById("ozetKarti").hidden = false;
  }

  if (adim.veri && adim.veri.length) {
    const enBuyuk = Math.max.apply(null, adim.veri.map(function (d) { return d.deger; }));
    const g = document.getElementById("grafik");
    for (const d of adim.veri) {
      const c = el("div", "cizgi");
      c.appendChild(el("span", "ad", d.etiket));
      const yol = el("div", "yol");
      const cubuk = el("div", "cubuk");
      cubuk.style.width = Math.max(2, (d.deger / enBuyuk) * 100) + "%";
      yol.appendChild(cubuk);
      c.appendChild(yol);
      c.appendChild(el("span", "sayi", sayi(d.deger)));
      g.appendChild(c);
    }
    if (adim.not) document.getElementById("not").textContent = adim.not;
    document.getElementById("grafikKarti").hidden = false;
  }

  if (kolonlar.length) {
    // Sayisal kolonlarin basligi da saga hizalansin
    const sayisalKolon = kolonlar.map(function (_, n) {
      return satirlar.length > 0 && satirlar.every(function (s) { return typeof s[n] === "number"; });
    });

    const tb = document.getElementById("tbaslik");
    kolonlar.forEach(function (k, n) {
      tb.appendChild(el("th", sayisalKolon[n] ? "sayi" : null, k));
    });

    const tg = document.getElementById("tgovde");
    for (const satir of satirlar) {
      const tr = el("tr");
      for (const h of satir) {
        const s = typeof h === "number";
        const bos = h === null || h === undefined;
        tr.appendChild(el("td", s ? "sayi" : (bos ? "bos" : null), bos ? "—" : (s ? sayi(h) : String(h))));
      }
      tg.appendChild(tr);
    }
    document.getElementById("tabloKarti").hidden = false;
  }
}
</script>
</body>
</html>
